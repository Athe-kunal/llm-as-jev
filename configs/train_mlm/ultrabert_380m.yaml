# UltraBERT-380M as a decision model: one mask per option, " yes" verbalizer,
# full fine-tuning. Defaults from the model card (dmis-lab/UltraBERT-380M):
# AdamW (0.9, 0.98, 1e-6), weight decay 0.1, linear schedule with 5% warmup,
# lr swept over {5e-6, 8e-6, 1e-5, 3e-5} (8e-6 was best on MNLI at 380M).
# Override any value on the command line, e.g. optim.lr=1e-5 run.out=runs/x
model:
  id: dmis-lab/UltraBERT-380M
  revision: 671a38c087233c0cc72c5bfceea6fffa2822f1db
  attention: sdpa
  gradient_checkpointing: true

format:
  template: decision_mlm
  yes_token: " yes"
  no_token: null        # " no" scores logit(yes) - logit(no)

data:
  source: Athekunal/llm-jev-reason-long
  train_split: train
  eval_split: eval
  max_tokens: 32768
  eval_per: 100
  eval_seed: 20260922  # the eval rows; keep fixed across run.seed replicates

optim:
  lr: 8.0e-6
  betas: [0.9, 0.98]
  eps: 1.0e-6
  weight_decay: 0.1
  batch_size: 32
  warmup_ratio: 0.05
  min_lr_ratio: 0.0
  max_grad_norm: 1.0

run:
  out: runs/ultrabert_380m
  seed: 20260922
  epochs: 1
  max_steps: -1
  eval_every: 0
  skip_base_eval: false
  mixed_precision: bf16
