# AT2 on the featured UltraBERT run: learn one weight per (layer, head) so that
# attention from the answer's mask predicts the effect of removing sentences.
# Override any value on the command line, e.g. data.rows=500 out=runs/x
encoder:
  run: runs/ultrabert_380m_lr1.5e-5
  attention: varlen          # capture needs FA2 varlen

data:
  source: data/splits/reason_long_nimble
  split: train               # never eval: the eval split is for evaluation
  # The Qwen AT2 run's 8 document datasets, plus Nimble (it has gold evidence).
  # Left out: intent datasets (one-sentence messages) and PIQA.
  datasets: [anli, contractnli, cosmosqa, logiqa2, musique, nimble, proofwriter, quality, reclor]
  rows: 2000                 # balanced over the datasets
  min_sources: 2             # ablating needs at least two sentences
  masks: 32                  # ablations per row
  seed: 0

train:
  steps: 1000
  batch_size: 512
  lr: 1.0e-3
  max_grad_norm: 1.0
  val_frac: 0.1
  seed: 0

out: runs/at2_ultrabert_380m
