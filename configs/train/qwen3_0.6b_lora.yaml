# Qwen3-0.6B with LoRA, the LLM-as-Jev recipe (arXiv 2610.02076v3, Table 2):
# L_tree + KL anchors (lambda 1), one epoch, AdamW 1e-4, 100 warmup steps,
# then linear decay to 0.1x. Launch with configs/accelerate/fsdp2.yaml.
model:
  id: Qwen/Qwen3-0.6B
  finetune: lora
  lora_rank: 16
objective:
  anchors: [mass, out, pos]
  lam: 1.0
data:
  source: data/splits/reason_long_nimble
  max_tokens: 16384
  eval_per: 100
optim:
  lr: 1.0e-4
  weight_decay: 0.01
  batch_size: 32
  warmup_steps: 100
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
run:
  out: runs/qwen3_0.6b_lora
  epochs: 1
  mixed_precision: "no"
