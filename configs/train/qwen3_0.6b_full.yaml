# Qwen3-0.6B, full fine-tuning: the decoder baseline of the encoder paper.
# fp32 weights; p0 for the anchors is a frozen bf16 copy of the base model.
# Learning rate chosen on dev from {0.5, 1, 2} x 1e-5.
model:
  id: Qwen/Qwen3-0.6B
  finetune: full
objective:
  anchors: [mass, out, pos]
  lam: 1.0
data:
  source: data/splits/reason_long_nimble
  max_tokens: 16384
  eval_per: 100
optim:
  lr: 1.0e-5
  weight_decay: 0.01
  batch_size: 32
  warmup_steps: 100
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
run:
  out: runs/qwen3_0.6b_full_lr1e-5
  epochs: 1
  mixed_precision: "no"
