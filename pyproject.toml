[project]
name = "llm-jev"
version = "0.1.0"
description = "Train LLMs as Jev decision models and attribute their decisions with fast ContextCite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "datasets",
    "nvitop>=1.7.1",
    "torch==2.9.0",
    "torchvision==0.24.0",
    "transformers==5.17.0",
    "peft==0.21.0",
    "accelerate==1.15.0",
    "tensorboard",
    "flash-linear-attention==0.5.2",  # fast Gated DeltaNet for Qwen3.5
    # Fast short convolution in Qwen3.5's linear-attention layers. Built from
    # source against the installed torch: CUDA_HOME=/usr/local/cuda-12.6.
    "causal-conv1d==1.5.3.post1",
    "loguru>=0.7.3",
    "tensordict>=0.14.3",
    "nltk>=3.10.3",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
spans = ["openai>=1.50"]               # llm_jev.span_generation (vLLM server, OpenAI API)
dev = ["pytest", "hypothesis"]

[project.scripts]
llm-jev-train = "llm_jev.train.train:main"
llm-jev-evaluate = "llm_jev.evaluation.evaluate:main"
llm-jev-benchmarks = "llm_jev.evaluation.benchmarks:main"
llm-jev-build-data = "llm_jev.dataloader.build:main"
llm-jev-merge = "llm_jev.serving.merge:main"
llm-jev-spans = "llm_jev.span_generation.best_of_n:main"
llm-jev-sglang-cite = "llm_jev.serving.sglang_client:main"

# CUDA 12.8 wheels: run on the 550 driver and on 580+.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
no-build-isolation-package = ["causal-conv1d"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_jev*"]

[tool.setuptools.package-data]
llm_jev = ["prompts/*.j2"]
"llm_jev.span_generation" = ["*.j2", "*.sh"]

[tool.black]
line-length = 80
skip-magic-trailing-comma = true

[tool.ruff]
line-length = 80
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "D", "N", "UP", "B"]
ignore = ["D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true

