[project]
name = "llm-jev"
version = "0.2.0"
description = "Decision models that pick one option per forward pass: LLM-as-Jev decoders and masked-LM encoders, with an evidence head"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate==1.15.0",
    "datasets",
    "jinja2",
    "loguru>=0.7.3",
    "nltk>=3.10.3",
    "numpy",
    "omegaconf>=2.3",
    "pandas",
    "peft==0.21.0",
    "scikit-learn>=1.9.1",
    "scipy",
    "tensorboard",
    "tensordict>=0.14.3",
    "torch==2.9.0",
    "transformers==5.20.2",  # >= 5.20: native UltraBERT
]

[project.optional-dependencies]
# Qwen3.5 decoders: fast Gated DeltaNet and short convolutions. causal-conv1d
# is built from source against the installed torch (set CUDA_HOME).
qwen35 = ["flash-linear-attention==0.5.2", "causal-conv1d==1.5.3.post1"]
spans = ["openai>=1.50"]  # llm_jev.evidence.spans (vLLM server, OpenAI API)
paper = ["matplotlib"]  # paper/figures
dev = ["pytest", "ruff"]

[project.scripts]
llm-jev-build-data = "llm_jev.data.build:main"
llm-jev-train-decoder = "llm_jev.training.decoder:main"
llm-jev-train-encoder = "llm_jev.training.encoder:main"
llm-jev-evaluate = "llm_jev.evaluation.evaluate:main"
llm-jev-benchmarks = "llm_jev.evaluation.benchmarks:main"
llm-jev-train-evidence = "llm_jev.evidence.train:main"
llm-jev-spans = "llm_jev.evidence.spans:main"

# CUDA 12.8 wheels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
no-build-isolation-package = ["causal-conv1d"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_jev*"]

[tool.setuptools.package-data]
llm_jev = ["prompts/*.j2"]

[tool.ruff]
line-length = 80
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "D", "N", "UP", "B"]
ignore = ["D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E501"]  # Inline fixture data.
"src/llm_jev/data/sources/download.py" = ["E501"]  # pinned URLs and hashes

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true


[tool.pytest.ini_options]
testpaths = ["tests"]
